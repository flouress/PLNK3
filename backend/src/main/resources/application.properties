# Server
server.port=8080

# Google Sheets Configuration
# Nilai ini dibaca otomatis dari file .env di folder backend/
google.sheets.spreadsheet-id=${SPREADSHEET_ID}
google.sheets.credentials-path=credentials.json

# JWT Security Configuration
# Secret dibaca dari environment variable JWT_SECRET (wajib di-set!)
jwt.secret=${JWT_SECRET}
# Token expiry dalam milliseconds (default: 2 jam = 7200000 ms)
jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# Application
spring.application.name=dashboard-k3
